services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: connectuppro
      POSTGRES_USER: connectuppro
      POSTGRES_PASSWORD: connectuppro
    ports:
      - "5432:5432"
    volumes:
      - connectuppro-postgres:/var/lib/postgresql/data

volumes:
  connectuppro-postgres:
